[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp1-monitor-pc"
version = "0.4.5"
description = "PC monitor, relay, dashboard, PostgreSQL and AI diagnostics"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "websockets>=15,<16", "PyYAML>=6,<7"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
desktop = ["PySide6>=6.6,<7", "pyqtgraph>=0.13,<0.15", "numpy>=1.24,<3"]
station = ["paramiko>=3.4,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
rp1-monitor = "rp1_monitor.pc_cli:main"
rp1-factory-bridge = "rp1_monitor.factory_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rp1_monitor = ["web/*", "web/brand/*", "web/vendor/*", "web/models/*", "data/*.json", "data/*.zip", "data/site-platform-ca.crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
